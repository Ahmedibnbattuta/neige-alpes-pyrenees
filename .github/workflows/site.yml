name: Publier le site web

# Calcule la neige de chaque station (tools/snow_feed.py) puis publie le site + snow.json sur GitHub Pages.
# L'application et le site lisent ce même fichier snow.json.
# - automatiquement toutes les 2 heures ;
# - à la main : onglet Actions > « Publier le site web » > Run workflow.
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
# Remarque : GitHub suspend les tâches planifiées d'un dépôt public après 60 jours sans activité.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. Calcul de la neige et préparation du site
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Même liste de stations que l'application
      - run: cp app/src/main/assets/stations.json web/stations.json
      # Calcul incrémental : on repart de l'état publié précédemment
      - run: python tools/snow_feed.py web/stations.json web/snow.json https://ahmedibnbattuta.github.io/neige-alpes-pyrenees/snow.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # 2. Publication (étape séparée : le fichier préparé est alors bien enregistré par GitHub)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
