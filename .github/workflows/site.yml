name: Publier le site web

# Lancement manuel (onglet Actions > « Publier le site web » > Run workflow).
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
# GitHub Pages est gratuit pour un dépôt public ; pour un dépôt privé il faut un abonnement GitHub Pro.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Même liste de stations que l'application
      - run: cp app/src/main/assets/stations.json web/stations.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
