name: Vérifier le calcul de neige

# Lance les tests et un calcul complet du modèle de neige, SANS rien publier :
# le résultat (snow.json) est seulement joint à l'exécution pour vérification.
on:
  push:
    paths:
      - "tools/**"
      - "app/src/main/assets/stations.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tools/test_snow_feed.py -v
      - run: python tools/snow_feed.py app/src/main/assets/stations.json snow.json
      - uses: actions/upload-artifact@v4
        with:
          name: snow-json
          path: snow.json
