name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk NeigeAlpesPyrenees.apk
      - uses: actions/upload-artifact@v4
        with:
          name: neige-alpes-pyrenees-apk
          path: NeigeAlpesPyrenees.apk
      # Publie l'APK en téléchargement direct (page « Releases » du dépôt)
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Dernière version
          body: "APK compilé automatiquement depuis le commit ${{ github.sha }}."
          files: NeigeAlpesPyrenees.apk
          make_latest: true
